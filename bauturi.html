<!DOCTYPE html>
<html lang="ro"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#6c3fb5"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>🍸 Baruri & Cafenele — Timișoara Tasting Tour</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{--accent:#6c3fb5;} *{box-sizing:border-box;} html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #wrap{display:flex;height:100vh;} #sidebar{width:380px;min-width:380px;overflow-y:auto;background:#fafafa;border-right:1px solid #e2e2e2;} #map{flex:1;}
  header{padding:16px 18px;background:var(--accent);color:#fff;position:sticky;top:0;z-index:5;} header h1{margin:0;font-size:18px;} header p{margin:6px 0 0;font-size:12px;opacity:.9;}
  .search{padding:10px 14px;position:sticky;top:74px;background:#fafafa;z-index:4;border-bottom:1px solid #eee;} .search input{width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:8px;font-size:13px;}
  ul{list-style:none;margin:0;padding:0;} li{padding:11px 14px;border-bottom:1px solid #eee;cursor:pointer;font-size:13px;} li:hover{background:#f0eaff;}
  .row{display:flex;gap:10px;align-items:flex-start;} .num{flex:0 0 24px;height:24px;line-height:24px;text-align:center;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:600;}
  .thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:0 0 56px;background:#eee;}
  .info b{display:block;} .info .addr{color:#888;font-size:11px;} .desc{color:#555;font-size:11.5px;line-height:1.4;margin-top:5px;}
  .gmaps{display:inline-block;margin-top:5px;font-size:11px;color:var(--accent);text-decoration:none;} .gmaps:hover{text-decoration:underline;}
  .foot{padding:12px 14px;font-size:11px;color:#999;line-height:1.5;}
  .leaflet-popup-content{margin:10px 12px;max-width:240px;} .leaflet-popup-content img{width:100%;border-radius:8px;margin:6px 0;}

  /* ---- MOBILE: hartă full-screen + panou glisant (bottom sheet) ---- */
  @media (max-width:760px){
    #wrap{flex-direction:column;}
    #map{position:fixed;inset:0;height:100vh;height:100dvh;width:100vw;z-index:1;}
    #sidebar{
      position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;min-width:0;z-index:1000;
      height:82vh;height:82dvh;transform:translateY(calc(82vh - 128px));transform:translateY(calc(82dvh - 128px));
      transition:transform .28s cubic-bezier(.4,0,.2,1);
      border-right:none;border-top-left-radius:18px;border-top-right-radius:18px;
      box-shadow:0 -4px 24px rgba(0,0,0,.28);background:#fff;overflow:hidden;display:flex;flex-direction:column;
    }
    #sidebar.open{transform:translateY(0);}
    #grabber{display:block;flex:0 0 auto;padding:9px 0 5px;text-align:center;cursor:grab;background:#fff;
      border-top-left-radius:18px;border-top-right-radius:18px;position:relative;z-index:6;}
    #grabber::before{content:"";display:inline-block;width:44px;height:5px;border-radius:3px;background:#ccc;}
    header{position:static;border-top-left-radius:18px;border-top-right-radius:18px;padding:4px 18px 12px;}
    header h1{font-size:16px;}
    #sidebar > ul{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
    .filters,.search{position:static;}
    .legend{bottom:auto;top:12px;right:12px;}
    .leaflet-control-zoom{margin-top:64px !important;}
  }
  @media (min-width:761px){ #grabber{display:none;} }

</style></head><body>
<div id="wrap"><div id="sidebar"><div id="grabber" title="Trage pentru listă"></div>
  <header><h1>🍸 Baruri & Cafenele</h1><p>20 localuri · Timișoara Tasting Tour · cocktail semnătură + poză</p></header>
  <div class="search"><input id="q" placeholder="Caută un local…"/></div><ul id="list"></ul>
  <div class="foot">Descrieri & poze: timisoaratastingtour.ro · dale hartă Esri.</div>
</div><div id="map"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DATA=[{"name": "Alice Kyteler", "lat": 45.758436, "lon": 21.229487, "address": "Piața Unirii, Cetate, Timișoara", "found": true, "desc": "Witch Tonic – un cocktail pe bază de gin, cu note delicate de migdale, pentru o combinație aromată, fresh și ușor misterioasă. Alice Kyteler – un bar cu atmosferă eclecticǎ și un meniu de cocktailuri care invită la descoperit combinații mai puțin obișnuite.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/89515MT9_1537.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/alice-kyteler"}, {"name": "Atelier D experience", "lat": 45.755123, "lon": 21.227984, "address": "Str. Dimitrie Cantemir 1, Timișoara", "found": true, "desc": "Bega Breeze – gin, aloe vera și violete într-un cocktail fresh, floral și delicat, cu un aer de vară și o culoare care face jumătate din treabă. Atelier D’Experience – un loc în care experiența începe înainte de prima înghițitură, de la decor și atmosferă până la combinațiile din pahar.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/38699MT9_2528.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/atelier-d-experience"}, {"name": "Ayahuasca", "lat": 45.757855, "lon": 21.225464, "address": "Str. Gheorghe Lazăr, Cetate, Timișoara", "found": true, "desc": "Cocktail Peruvian Pisco – un cocktail cu Pisco, spiritul emblematic al Peruului, cu un profil fresh și aromat, perfect pentru cei care vor să descopere o altă față a cocktailurilor clasice. Ayahuasca – un loc cu influențe sud-americane, atmosferă vibrantă și o selecție de băuturi care te poartă puțin mai departe de Timișoara.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/61337MT9_3433.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/ayahuasca"}, {"name": "Baroque", "lat": 45.757532, "lon": 21.229982, "address": "Piața Unirii, Cetate, Timișoara", "found": true, "desc": "Gin Ruby Brew – gin și cold brew într-un mix neașteptat, cu note de cafea și un profil intens, dar echilibrat. Baroque – o cafenea de specialitate cu o identitate bine conturată, unde cafeaua ocupă locul central, iar creativitatea se simte și dincolo de ceașcă.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/73510MT9_9837.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/baroque"}, {"name": "Bereta", "lat": 45.758072, "lon": 21.22621, "address": "Str. Mărășești 12, Timișoara", "found": true, "desc": "Smoothie Sour 200 ml – o bere sour cu textură catifelată și note fructate, gândită pentru cei care preferă berile cu personalitate și un profil mai fresh Bereta Taproom & Bottleshop – un loc pentru cei care își aleg berea după gust, nu după etichetă, cu o selecție care trece mult dincolo de clasicele beri blonde", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/92941WhatsApp-Image-2026-09-23-at-13.12.49.jpeg", "url": "https://www.timisoaratastingtour.ro/bauturi/bereta"}, {"name": "D'arc Atelier", "lat": 45.758343, "lon": 21.228037, "address": "Piața Unirii 5 (colț Str. Eremia Grigorescu), Timișoara", "found": true, "desc": "D`arc Atelier Velvet S trawberry Colada – un cocktail cu lichior Bumbu , suc de ananas, sweet & sour și piure de căpșuni. Fructat și fresh, cu un echilibru între dulceața ananasului și căpșunilor și nota ușor acidulată a mixului. D’arc Atelier – un spațiu cunoscut pentru atmosfera sa urbană și programul variat de evenimente, de la seri cu muzică și DJ seturi până la evenimente culturale. Un loc cu o identitate proprie în peisajul de nightlife al Timișoarei.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/69860MT9_2810.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/d-arc-atelier"}, {"name": "Hype", "lat": 45.757678, "lon": 21.227336, "address": "Piața Unirii 4, Cetate, Timișoara", "found": true, "desc": "Hype Velvet Monkey – poți alege una dintre cele două variante ale cocktailului: varianta cu alcool sau varianta N.A. , fără alcool. Două versiuni ale aceleiași combinații, în funcție de ce preferi. Hype Culture – un restaurant și bar din centrul Timișoarei, unde partea de gastronomie se întâlnește cu cocktailurile, muzica și evenimentele live. Locul are un ritm propriu, de la mese și brunch-uri până la seri cu DJ și o atmosferă mai energică.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/11404MT9_2110.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/hype"}, {"name": "Irish Pub", "lat": 45.756782, "lon": 21.230642, "address": "Str. Eugeniu de Savoya 4, Cetate, Timișoara", "found": true, "desc": "Shot Irish Spirit – un shot cu personalitate, inspirat de spiritul irlandez și făcut pentru cei care vor să înceapă experiența cu ceva scurt și intens. Irish Public House – un pub din centrul Timișoarei, inspirat de atmosfera tradițională a puburilor irlandeze. Muzica, băuturile și preparatele cu specific creează un loc potrivit pentru întâlniri cu prietenii și seri care se prelungesc la povești.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/51540MT8_5058.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/irish-pub"}, {"name": "Le Dome", "lat": 45.758406, "lon": 21.229886, "address": "Piața Unirii 11, Timișoara", "found": true, "desc": "Kir Royal / Cinderella – ai de ales între două variante: Kir Royal , varianta cu alcool, sau Cinderella , varianta fără alcool. Două cocktailuri diferite, pentru aceeași idee de răsfăț la pahar. Le Dome – amplasat chiar în Piața Unirii, Le Dome combină partea de cafenea, bistro și bar, cu un meniu internațional și o terasă cu vedere spre una dintre cele mai cunoscute piețe ale orașului.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/17991MT9_0986.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/le-dome"}, {"name": "Matcha Ty", "lat": 45.756335, "lon": 21.230816, "address": "Str. Eugeniu de Savoya 1, Cetate, Timișoara", "found": true, "desc": "Crushed Lychee Matcha – matcha cu note delicate de lychee, într-o combinație fresh și fructată, care echilibrează gustul vegetal al matcha-ului cu dulceața aromată a fructului. Matcha TY – primul bar autentic de matcha din Timișoara, dedicat în întregime culturii matcha și preparării ei în forme diferite. Locul pune accent pe calitate și pe prepararea atentă a matcha-ului, într-un spațiu dedicat celor care vor să descopere băutura dincolo de varianta clasică.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/55686MT9_9076.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/matcha-ty"}, {"name": "Nava Pelican", "lat": 45.748859, "lon": 21.224838, "address": "Canal Bega, lângă Podul Mihai Viteazu, Timișoara", "found": true, "desc": "Shot Brain Damage – un shot cu lichior de piersici, Baileys și sirop de grenadine, cu un profil dulce, cremos și fructat. Pelican – un loc cu totul aparte în Timișoara, aflat chiar pe Bega, la bordul legendarului vapor Pelican. Cu o poveste legată de oraș și de viața de pe canal, locul păstrează un aer nostalgic și o identitate pe care nu o găsești în orice bar.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/92401MT9_3017.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/nava-pelican"}, {"name": "Reciproc", "lat": 45.757379, "lon": 21.233448, "address": "Str. Martin Luther 4, Cetate, Timișoara", "found": true, "desc": "Tap Beer Independent – poți alege una dintre cele trei variante: Pils, Weiss sau Helles , fiecare cu propriul profil de gust, de la caracterul mai fresh și ușor amar al unui Pils până la notele mai blânde și maltate ale unui Helles. Reciproc – un loc care a pornit ca băcănie cu produse artizanale și a devenit un reper pentru cei interesați de producători locali, bere craft și produse făcute cu grijă. În plus față de selecția de beri, găsești cafea, vinuri și produse locale, într-un spațiu care pune accent pe comunitate și consum responsabil.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/90MT8_3402.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/reciproc"}, {"name": "Stage Pub", "lat": 45.756394, "lon": 21.228702, "address": "Str. Florimund Mercy, Cetate, Timișoara", "found": true, "desc": "Honey Berry Fizz – un cocktail cu Jack Daniel’s Honey , cu note dulci și fructate, completate de o doză de prospețime și un finish ușor acidulat. O combinație echilibrată între caracterul whiskey-ului și aromele de fructe de pădure. Stage Pub – un pub din centrul Timișoarei în care muzica live este parte din identitatea locului. Cu seri dedicate concertelor, influențe rock și un meniu de food & drinks, Stage Pub pune accent pe energia de concert și pe atmosfera de pub.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/12594MT9_2375.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/stage-pub"}, {"name": "Storia", "lat": 45.75667, "lon": 21.228195, "address": "Str. Eugeniu de Savoya, Cetate, Timișoara", "found": true, "desc": "Rum & Mango – un cocktail cu Bacardi alb și sirop de mango, cu un profil fructat și dulce, echilibrat de caracterul discret al romului. Simplu, fresh și ușor de savurat. Storia – un restaurant și cocktail bar din Timișoara, cunoscut pentru serile animate, meniul variat și atmosfera urbană. Un loc în care partea de gastronomie se îmbină cu băuturile și evenimentele, de la brunch-uri și cine până la seri cu muzică.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/3662file_0000000082d0820a806b343f58f476de.png", "url": "https://www.timisoaratastingtour.ro/bauturi/storia"}, {"name": "The Charlatan's Pub", "lat": 45.758555, "lon": 21.227101, "address": "Str. Emanuil Ungureanu, Cetate, Timișoara", "found": true, "desc": "The Charlatan`s Pub JACK PINE-APPLE – Jack Apple, suc de lămâie, suc de ananas, apă tonică și frunză de busuioc. Un cocktail fresh, cu note fructate și o ușoară aciditate, completat de aroma subtilă de busuioc The Charlatans Pub – un pub cu atmosferă relaxată și energie bună, potrivit pentru o pauză de la traseul gastronomic și un cocktail savurat alături de prieteni. Un loc unde muzica, băuturile și atmosfera de pub se întâlnesc într-un cadru casual", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/74430Screenshot-2025-09-16-105126.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/the-charlatan-s-pub"}, {"name": "Toffee Coffee", "lat": 45.756958, "lon": 21.22992, "address": "Str. Episcop Augustin Pacha, Cetate, Timișoara", "found": true, "desc": "Açai Smoothie – un smoothie fresh și fructat, cu textura cremoasă specifică açaiului și un gust natural, ușor acrișor. O băutură răcoritoare, potrivită pentru cei care preferă combinațiile cu fructe. Toffee Coffee – o cafenea de specialitate din centrul Timișoarei, cunoscută pentru cafeaua atent preparată, deserturi și băuturi creative. Are și o curte interioară liniștită, care completează atmosfera intimă a locului.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/80594WhatsApp-Image-2026-09-19-at-14.27.24.jpeg", "url": "https://www.timisoaratastingtour.ro/bauturi/toffee-coffee"}, {"name": "Tucano Coffee Venezuela", "lat": 45.765751, "lon": 21.229167, "address": "Piața Consiliul Europei 2 (Iulius Town), Timișoara", "found": true, "desc": "Iullius Town Aqua Mango Matcha – matcha preparată cu Aqua Carpatica Flavours cu aromă de mango , o combinație fresh și fructată, în care gustul vegetal al matcha-ului este completat de aroma dulce și tropicală a mango-ului. Tucano Coffee Venezuela Iulius Town – o cafenea cu un concept inspirat din cultura cafelei și din spiritul călătoriilor, cunoscută pentru atmosfera colorată, băuturile creative și combinațiile care ies din tiparele clasice. Locația din Iulius Town aduce în meniu cafea, matcha și băuturi fresh, într-un spațiu relaxat și vibrant.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/61267MT9_5702.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/tucano-coffee-venezuela-iullius-town"}, {"name": "Tucano Coffee Mexico", "lat": 45.756704, "lon": 21.22718, "address": "Str. Eugeniu de Savoya (Piața Unirii), Cetate, Timișoara", "found": true, "desc": "Piața Unirii Ice Latte + Carrot Cake – combinația dintre un ice latte rece și cremos și o felie de carrot cake cu aromă de scorțișoară și textură fragedă. Un duo echilibrat între cafea, condimente calde și dulceață. Tucano Coffee Mexico Piața Unirii – o cafenea cu un concept inspirat din cultura cafelei de specialitate și din atmosfera vibrantă a orașului. Situată în Piața Unirii, locația combină cafeaua, deserturile și un design colorat, într-un spațiu potrivit pentru întâlniri, lucru sau o pauză de la agitația orașului.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/6624MT9_1636.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/tucano-coffee-mexico-piata-unirii"}, {"name": "Wizards", "lat": 45.754396, "lon": 21.228357, "address": "Str. János Bolyai, Timișoara", "found": true, "desc": "Peach Ring Margarita – o margarita cu un twist fructat, inspirată de gustul dulce și ușor acrișor al bomboanelor Peach Ring. O variantă jucăușă a unui cocktail clasic, cu un profil fresh și dulce-acrișor. Wizards – un pub cu tematică magică în centrul Timișoarei, unde cocktailurile devin parte din povestea locului. Decorul inspirat de universul vrăjitorilor, băuturile cu denumiri tematice și atmosfera de seară îi dau un caracter aparte.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/37171MT9_0193.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/wizards"}, {"name": "Zai Miniature", "lat": 45.756796, "lon": 21.228745, "address": "Str. Florimund Mercy 5, Cetate, Timișoara", "found": true, "desc": "Mezcalita a la Zai – mezcal infuzat cu ananas și castravete, îndulcit cu sirop de miere și echilibrat cu suc de lime. Un cocktail cu note afumate, fructate și fresh, în care dulceața și aciditatea se completează foarte bine. Zai Mini – un cocktail bar și cafenea din Piața Unirii, cunoscut pentru selecția de cocktailuri și băuturi pregătite în combinații proprii. Terasa cu vedere spre piață și poziționarea centrală fac parte din identitatea locului.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/26400MT9_1220--1-.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/zai-miniature"}]; const ACCENT="#6c3fb5";
/* invalidateSize-injected */ const map=window.map=L.map('map').setView([45.7565,21.2287],15);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'}).addTo(map);
function icon(n){return L.divIcon({className:'',html:`<div style="background:${ACCENT};color:#fff;border:2px solid #fff;border-radius:50%;width:26px;height:26px;line-height:22px;text-align:center;font-weight:600;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.4)">${n}</div>`,iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-14]});}
const markers=[],bounds=[];
DATA.forEach((d,i)=>{const n=i+1;const g=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.name+' Timisoara')}`;
  const m=L.marker([d.lat,d.lon],{icon:icon(n)}).addTo(map);
  const img=d.img?`<img src="${d.img}" alt="${d.name}"/>`:'';
  m.bindPopup(`<b>${n}. ${d.name}</b>${img}<div style="font-size:12px;color:#555;line-height:1.45">${d.desc||''}</div><div style="color:#888;font-size:11px;margin-top:5px">${d.address||''}</div><a href="${g}" target="_blank">➜ Google Maps</a>`,{maxWidth:260});
  markers.push(m);bounds.push([d.lat,d.lon]);});
map.fitBounds(bounds,{padding:[40,40]});
const list=document.getElementById('list');
DATA.forEach((d,i)=>{const li=document.createElement('li');const g=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.name+' Timisoara')}`;
  const thumb=d.img?`<img class="thumb" src="${d.img}" alt="">`:`<div class="thumb"></div>`;
  li.innerHTML=`<div class="row"><span class="num">${i+1}</span>${thumb}<span class="info"><b>${d.name}</b><span class="addr">${d.address||''}</span></span></div><div class="desc">${d.desc||''}</div><a class="gmaps" href="${g}" target="_blank" onclick="event.stopPropagation()">➜ Google Maps</a>`;
  li.onclick=()=>{map.setView([d.lat,d.lon],17);markers[i].openPopup();};li.dataset.name=(d.name+' '+(d.desc||'')).toLowerCase();list.appendChild(li);});
document.getElementById('q').addEventListener('input',e=>{const v=e.target.value.toLowerCase();[...list.children].forEach(li=>{li.style.display=li.dataset.name.includes(v)?'':'none';});});

/* grabber-toggle-injected */
(function(){
  var sb=document.getElementById('sidebar'), gr=document.getElementById('grabber');
  if(gr){ gr.addEventListener('click',function(){ sb.classList.toggle('open'); setTimeout(function(){ if(window.map&&map.invalidateSize)map.invalidateSize(); },320); }); }
  // when a list item is tapped on mobile, collapse the sheet so the map is visible
  var ul=document.getElementById('list');
  if(ul){ ul.addEventListener('click',function(){ if(window.matchMedia('(max-width:760px)').matches){ sb.classList.remove('open'); } }); }
  window.addEventListener('resize',function(){ if(window.map&&map.invalidateSize)map.invalidateSize(); });
  setTimeout(function(){ if(window.map&&map.invalidateSize)map.invalidateSize(); },400);
})();
</script></body></html>
