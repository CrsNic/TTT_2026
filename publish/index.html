<!DOCTYPE html>

<title>🍽️🍸 Timișoara Tasting Tour — Hartă completă</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{--food:#c0392b;--drink:#6c3fb5;} *{box-sizing:border-box;} html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #wrap{display:flex;height:100vh;} #sidebar{width:380px;min-width:380px;overflow-y:auto;background:#fafafa;border-right:1px solid #e2e2e2;} #map{flex:1;}
  header{padding:16px 18px;background:linear-gradient(135deg,var(--food),var(--drink));color:#fff;position:sticky;top:0;z-index:6;} header h1{margin:0;font-size:17px;} header p{margin:6px 0 0;font-size:12px;opacity:.92;}
  .filters{display:flex;gap:8px;padding:10px 14px;position:sticky;top:78px;background:#fafafa;z-index:5;border-bottom:1px solid #eee;}
  .chip{flex:1;text-align:center;padding:7px 6px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;border:2px solid transparent;user-select:none;}
  .chip.food{background:#fdecea;color:var(--food);border-color:var(--food);} .chip.drink{background:#efe9f9;color:var(--drink);border-color:var(--drink);} .chip.off{opacity:.35;border-color:transparent;}
  .search{padding:8px 14px;position:sticky;top:127px;background:#fafafa;z-index:5;border-bottom:1px solid #eee;} .search input{width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:8px;font-size:13px;}
  ul{list-style:none;margin:0;padding:0;} li{padding:11px 14px;border-bottom:1px solid #eee;cursor:pointer;font-size:13px;} li:hover{background:#eef3ff;}
  .row{display:flex;gap:10px;align-items:flex-start;} .num{flex:0 0 24px;height:24px;line-height:24px;text-align:center;border-radius:50%;color:#fff;font-size:11px;font-weight:600;} .num.food{background:var(--food);} .num.drink{background:var(--drink);}
  .thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:0 0 52px;background:#eee;}
  .info b{display:block;} .info .addr{color:#888;font-size:11px;} .desc{color:#555;font-size:11.5px;line-height:1.4;margin-top:5px;}
  .gmaps{display:inline-block;margin-top:5px;font-size:11px;text-decoration:none;} .gmaps.food{color:var(--food);} .gmaps.drink{color:var(--drink);} .gmaps:hover{text-decoration:underline;}
  .foot{padding:12px 14px;font-size:11px;color:#999;line-height:1.5;}
  .legend{position:absolute;bottom:14px;right:14px;background:#fff;padding:8px 12px;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.25);font-size:12px;z-index:500;} .legend div{display:flex;align-items:center;gap:7px;margin:3px 0;} .dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 2px rgba(0,0,0,.4);}
  .leaflet-popup-content{margin:10px 12px;max-width:240px;} .leaflet-popup-content img{width:100%;border-radius:8px;margin:6px 0;}

  /* ---- MOBILE: hartă full-screen + panou glisant (bottom sheet) ---- */
  @media (max-width:760px){
    #wrap{flex-direction:column;}
    #map{position:fixed;inset:0;height:100vh;height:100dvh;width:100vw;z-index:1;}
    #sidebar{
      position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;min-width:0;z-index:1000;
      height:82vh;height:82dvh;transform:translateY(calc(82vh - 128px));transform:translateY(calc(82dvh - 128px));
      transition:transform .28s cubic-bezier(.4,0,.2,1);
      border-right:none;border-top-left-radius:18px;border-top-right-radius:18px;
      box-shadow:0 -4px 24px rgba(0,0,0,.28);background:#fff;overflow:hidden;display:flex;flex-direction:column;
    }
    #sidebar.open{transform:translateY(0);}
    #grabber{display:block;flex:0 0 auto;padding:9px 0 5px;text-align:center;cursor:grab;background:#fff;
      border-top-left-radius:18px;border-top-right-radius:18px;position:relative;z-index:6;}
    #grabber::before{content:"";display:inline-block;width:44px;height:5px;border-radius:3px;background:#ccc;}
    header{position:static;border-top-left-radius:18px;border-top-right-radius:18px;padding:4px 18px 12px;}
    header h1{font-size:16px;}
    #sidebar > ul{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
    .filters,.search{position:static;}
    .legend{bottom:auto;top:12px;right:12px;}
    .leaflet-control-zoom{margin-top:64px !important;}
  }
  @media (min-width:761px){ #grabber{display:none;} }

</style></head><body>

<script>
const DATA=[{"name": "A'Clair by Alma Dulce", "lat": 45.7569456, "lon": 21.2279142, "address": "Str. Vasile Alecsandri 7, Timișoara", "found": true, "cat": "food", "desc": "A’Clair by Alma Dulce Ecler – un ecler artizanal cu cremă fină de vanilie și glazură de ciocolată, un desert clasic pregătit cu atenție la fiecare detaliu A’Clair – o cofetărie dedicată iubitorilor de eclere, cu un spațiu la fel de atent gândit precum deserturile din vitrină", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/15947MT9_2543.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/a-clair-by-alma-dulce"}, {"name": "Balkan Bistro", "lat": 45.7576391, "lon": 21.2279885, "address": "Piața Unirii, Timișoara", "found": true, "cat": "food", "desc": "Banjalučki ćevapi – ćevapi de vită, fragezi și bine rumeniți, pregătiți în stilul tradițional din Banja Luka, cu acel gust simplu și intens care nu are nevoie de prea multe explicații. Balkan Bistro – un loc cu mese pline, farfurii generoase și influențe balcanice care se simt atât în meniu, cât și în atmosfera de aici.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/74255MT8_4914.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/balkan-bistro"}, {"name": "Berarescu", "lat": 45.7487701, "lon": 21.2270696, "address": "Splaiul Spiru Haret, Timișoara", "found": true, "cat": "food", "desc": "Cremă de fasole cu crumble de șonc afumat & 330 ml berea casei – o combinație cu gusturi intense și contrastante, în care cremozitatea fasolei întâlnește textura crocantă și aroma afumată a șoncului, completată de berea casei Berarescu – un loc construit în jurul berii bune, al mâncării consistente și al unei atmosfere relaxate, unde berea casei își găsește locul firesc lângă farfurie", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/9545MT9_2209.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/berarescu"}, {"name": "Beraria 700", "lat": 45.7564114, "lon": 21.2238428, "address": "Str. Coriolan Brediceanu, Timișoara", "found": true, "cat": "food", "desc": "Papanași fierți – un desert tradițional bănățean, fraged și reconfortant, perfect pentru a-ți încheia traseul cu ceva dulce, ca la bunica acasă Berăria 700 – o locație cu peste 10 ani de tradiție în Timișoara, unde gusturile locale și atmosfera de berărie merg firesc împreună", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/72651MT9_1240.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/beraria-700"}, {"name": "Biofresh", "lat": 45.7561014, "lon": 21.2309482, "address": "Str. Francesco Griselini 2, Timișoara", "found": true, "cat": "food", "desc": "Bruschetta Biofresh – o bruschetta vegetariană cu pateu vegetal, roșii și măsline aduse direct din Grecia, pusă pe pâine crocantă. Un preparat simplu, colorat și plin de gust, făcut pentru zilele în care vrei ceva bun și fresh Biofresh – un restaurant cunoscut și îndrăgit de comunitatea vegetariană din Timișoara, unde găsești preparate cu ingrediente atent alese și combinații care fac din mâncarea fără carne o alegere ușoară", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/26927MT9_9201.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/biofresh"}, {"name": "Boom Pub", "lat": 45.7574378, "lon": 21.2282438, "address": "Piața Unirii 3, Timișoara", "found": true, "cat": "food", "desc": "Mici – rumeniți bine la exterior și suculenți la interior, serviți în stilul clasic, pentru o oprire care își păstrează lucrurile simple și bune Boom Pub – un pub cu energie, seri animate și o atmosferă care prinde cel mai bine când masa e plină și timpul nu se măsoară în minute", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/40954MT8_4609.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/boom-pub"}, {"name": "Bruck Brasserie", "lat": 45.7573057, "lon": 21.2287873, "address": "Casa Brück, Str. Florimund Mercy 9, Piața Unirii, Timișoara", "found": true, "cat": "food", "desc": "Camembert la cuptor cu sos de merișoare, nuci caramelizate & fulgi de chili – un preparat cu texturi și gusturi bine echilibrate, de la cremozitatea brânzei până la dulceața fructată și nota discret picantă Bruck Brasserie – situat chiar în Piața Unirii, Bruck Brasserie completează atmosfera uneia dintre cele mai cunoscute piețe din Timișoara cu un meniu de inspirație europeană și un spațiu cu aer contemporan", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/80928MT8_2615.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/bruck-brasserie"}, {"name": "Bruck Pizza", "lat": 45.7572214, "lon": 21.2288186, "address": "Str. Florimund Mercy 9, Timișoara", "found": true, "cat": "food", "desc": "Panini cu mortadela și stracciatella – mortadela fină și stracciatella cremoasă, într-un panini cu un echilibru plăcut între textură, prospețime și gust intens Bruck Pizza – un loc dedicat bucătăriei italiene, cu pizza în centrul meniului și preparate care completează experiența dincolo de clasicele italiene", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/99613MT8_2449.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/bruck-pizza"}, {"name": "Calul Alb", "lat": 45.7568042, "lon": 21.2284262, "address": "Str. Eugeniu de Savoya, Timișoara", "found": true, "cat": "food", "desc": "Mousse de fistic cu crumble de biscuiți și coulis de căpșuni – un desert fin și cremos, cu textura crocantă a biscuiților și o notă fructată care îi aduce prospețime La Calul Alb – un restaurant cu personalitate, unde atmosfera caldă și meniul variat fac loc atât preparatelor consistente, cât și deserturilor atent construite", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/76177MT8_4182.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/calul-alb"}, {"name": "Caramelis", "lat": 45.7567, "lon": 21.22745, "address": "Str. Eugeniu de Savoya 15, Timișoara", "found": true, "cat": "food", "desc": "Clătită japoneză – pufoasă și aerată, cu o textură aproape de sufleu, pentru un desert delicat și diferit de clasica clătită Caramelis – un loc dedicat deserturilor, cu un meniu construit în jurul texturilor fine, al combinațiilor dulci și al prezentărilor care atrag privirea", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/91918MT9_1588.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/caramelis"}, {"name": "Casa Bunicii", "lat": 45.756552, "lon": 21.229158, "address": "Str. Eugeniu de Savoya 7 (Casa Bunicii 3 - Unirii), Timișoara", "found": true, "cat": "food", "desc": "Desert Mortal – colivă, înghețată cremoasă și bezea crocantă, într-o combinație surprinzătoare de texturi și temperaturi, care reinterpretează un desert tradițional într-o formă actuală Casa Bunicii – un nume cunoscut în gastronomia timișoreană, care pune în valoare preparatele românești și gusturile de acasă, reinterpretate într-o manieră actuală", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/95125MT8_3216.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/casa-bunicii"}, {"name": "Chantia", "lat": 45.7570999, "lon": 21.2299351, "address": "Str. Episcop Augustin Pacha 10, Timișoara", "found": true, "cat": "food", "desc": "Gelato – o cupă de gelato, cu posibilitatea de a alege dintre 6 sortimente, de la variante clasice la combinații mai îndrăznețe Chantia – un loc dedicat iubitorilor de deserturi și gusturi dulci, unde gelato-ul este pregătit pentru a fi savurat simplu, fără prea multe artificii. Un popas perfect pentru o pauză dulce în timpul turului, cu mai multe sortimente din care poți alege", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/56604MT9_5319.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/chantia"}, {"name": "Chin Chin", "lat": 45.7653581, "lon": 21.2299785, "address": "Fountain Plaza (Iulius Town / Openville), Timișoara", "found": true, "cat": "food", "desc": "Philadelphia cu somon & Philadelphia cu creveți – două preparate Philadelphia, unul cu somon și unul cu creveți, pe care le primești împreună, pentru a te bucura de ambele variante Chin Chin – un loc cunoscut pentru preparatele asiatice și pentru combinațiile de sushi care pun accent pe ingrediente fresh și gusturi echilibrate. O oprire potrivită pentru iubitorii de sushi, dar și pentru cei care vor să descopere ceva nou în traseul lor gastronomic", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/45193MT8_1720.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/chin-chin"}, {"name": "Cofetaria Trandafirul", "lat": 45.7562084, "lon": 21.2309596, "address": "Str. Proclamația de la Timișoara 5, Timișoara", "found": true, "cat": "food", "desc": "Tort Imperial – un desert clasic de cofetărie, cu texturi fine și un gust bogat, potrivit pentru o oprire dulce în cadrul turului Cofetăria Trandafirul – un nume cunoscut în Timișoara pentru deserturile de cofetărie și rețetele care au rămas în preferințele timișorenilor de-a lungul timpului. Un loc unde găsești torturi și prăjituri pregătite pentru momentele în care ai poftă de ceva dulce", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/652MT9_9345.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/cofetaria-trandafirul"}, {"name": "Curtea Berarilor", "lat": 45.756303, "lon": 21.231835, "address": "Str. Eugeniu de Savoya, Timișoara", "found": true, "cat": "food", "desc": "Beer Boquete – mici în crustă de panko, serviți alături de 100 ml de bere. O combinație între un preparat românesc bine cunoscut și o textură crocantă, perfectă pentru atmosfera de berărie Curtea Berarilor – un loc în care berea și preparatele consistente fac echipă bună. Cu atmosfera specifică unei berării și un meniu potrivit pentru ieșiri cu prietenii, este o oprire potrivită pentru cei care vor să combine mâncarea cu o bere rece", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/41457MT9_9521.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/curtea-berarilor"}, {"name": "Czech In by Staropramen", "lat": 45.7651083, "lon": 21.2296267, "address": "Fountain Plaza (Iulius Town / Openville), Timișoara", "found": true, "cat": "food", "desc": "Coaste de Porc BBQ – coaste de porc BBQ, cartofi prăjiți cu sos cheddar și castraveți murați, servite alături de bere Staropramen. O combinație consistentă, cu contraste între carnea fragedă, cartofii crocanți, sosul cremos și nota fresh a murăturilor Czech In – un loc inspirat de cultura berăriilor cehe, unde berea Staropramen se întâlnește cu preparate consistente și gusturi specifice. O oprire potrivită pentru cei care apreciază combinațiile simple, sățioase și o bere rece", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/46450MT8_1100.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/czech-in"}, {"name": "Dantino", "lat": 45.763573, "lon": 21.225664, "address": "Piața Consiliul Europei 14A, Timișoara", "found": true, "cat": "food", "desc": "Pate de fazan artizanal – un preparat cu gust bogat și textură fină, completat de dulceața naturală a smochinelor și de pâinea proaspăt coaptă. O combinație echilibrată între note sărate, dulci și aromate Dantino – un restaurant cu o abordare atentă asupra preparatelor și ingredientelor, unde rețetele sunt construite în jurul combinațiilor de gust și al produselor bine alese. Un loc potrivit pentru cei care vor să descopere preparate mai puțin obișnuite", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/12706MT8_0686.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/dantino"}, {"name": "Drunken Rat", "lat": 45.7584024, "lon": 21.2301092, "address": "Str. George Coșbuc, Timișoara", "found": true, "cat": "food", "desc": "Mini Smash Burger – un smash burger în variantă mini, servit cu cartofi prăjiți și sos. Simplu, gustos și ușor de savurat, cu acel mix de carne rumenită, cartofi crocanți și sos cremos Drunken Rat – un pub cu o atmosferă relaxată și un stil casual, cunoscut pentru preparatele consistente și combinațiile potrivite pentru o ieșire cu prietenii. Un loc în care mâncarea, băuturile și atmosfera de pub merg mână în mână", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/98339MT9_1460.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/drunken-rat"}, {"name": "Eat Like a Man", "lat": 45.7576293, "lon": 21.2278953, "address": "Str. Gheorghe Lazăr, Timișoara", "found": true, "cat": "food", "desc": "Splash Burger – burger servit într-un sos cremos de cheddar, care îl acoperă generos și îi dă un plus de savoare. O combinație bogată, cu mult cheddar și exact genul de preparat care îți cere să te murdărești puțin pe mâini Eat Like a Man – un loc dedicat preparatelor consistente și combinațiilor generoase, cu un meniu construit în jurul gusturilor intense și al porțiilor care nu trec neobservate", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/79561MT9_2011.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/eat-like-a-man"}, {"name": "El Maguey", "lat": 45.756928, "lon": 21.2266323, "address": "Str. Eugeniu de Savoya 20, Timișoara", "found": true, "cat": "food", "desc": "Tamal – un preparat tradițional latino-american, pregătit din aluat de porumb și umplut cu ingrediente savuroase, apoi gătit în frunze de porumb. O combinație simplă, dar plină de gust și cu o textură specifică acestui preparat El Magüey – un loc dedicat bucătăriei mexicane și latino-americane, unde preparatele tradiționale sunt aduse într-un cadru relaxat. De la gusturi autentice până la combinații mai puțin obișnuite pentru publicul local, meniul pune accent pe specific și pe experiența culinară", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/49058MT9_1769.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/el-maguey"}, {"name": "Enjoy Sushi", "lat": 45.755346, "lon": 21.2293091, "address": "Str. Enrico Caruso 2, Timișoara", "found": true, "cat": "food", "desc": "Gunkan cu Saint-Jacques & Gunkan cu avocado și castravete – două tipuri de gunkan, unul cu Saint-Jacques și unul cu avocado și castravete, care aduc împreună gusturi marine delicate și note fresh, într-o combinație de texturi diferite Enjoy Sushi – un loc dedicat iubitorilor de sushi, cu un meniu variat care pune accent pe ingrediente proaspete, combinații echilibrate și preparate inspirate din bucătăria japoneză", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/80443MT9_2204.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/enjoy-sushi"}, {"name": "Fenice Palas", "lat": 45.7652458, "lon": 21.2279096, "address": "Piața Consiliul Europei 2E (Iulius Town / Openville), Timișoara", "found": true, "cat": "food", "desc": "Mezze – o selecție de preparate libaneze care aduce împreună salată tabouleh, hummus, falafel și mutabal. Un mix de texturi și arome, de la prospețimea salatei și cremozitatea hummusului până la gustul intens al mutabalului și textura crocantă a falafelului Fenice Palas – un restaurant cu specific libanez, unde preparatele tradiționale sunt în centrul experienței. Meniul aduce la aceeași masă aromele și ingredientele specifice bucătăriei levantine, într-un stil potrivit atât pentru cei familiarizați cu acest tip de gastronomie, cât și pentru cei care vor să o descopere", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/56493MT8_2149.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/fenice-palas"}, {"name": "Garage", "lat": 45.757358, "lon": 21.2301961, "address": "Str. Palanca, Timișoara", "found": true, "cat": "food", "desc": "Hummus cu sfeclă, dovleac copt cu za’atar & tahini – un preparat care combină cremozitatea hummusului cu sfeclă și dulceața dovleacului copt, completate de za’atar și tahini. Preparatul este însoțit de un drink la alegere: Aqua Flavors Raspberry Vodka , varianta alcoolică, sau No Hugo , varianta non-alcoolică Garage – un loc cu un concept relaxat și contemporan, unde mâncarea și băuturile se întâlnesc într-o atmosferă casual, cu influențe internaționale și combinații creative", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/69268MT8_4435.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/garage"}, {"name": "George's Snack Hut", "lat": 45.7570326, "lon": 21.2281086, "address": "Str. Vasile Alecsandri, Timișoara", "found": true, "cat": "food", "desc": "Chicken Steak Sandwich – un sandwich cu pui, sățios și plin de gust, servit într-o combinație de ingrediente care pune în valoare carnea fragedă și textura pâinii George’s Snack Hut – un loc cu un concept casual, axat pe preparate consistente și ușor de savurat. Un meniu potrivit pentru cei care caută combinații simple, gustoase și porții generoase", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/16274MT9_0844.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/george-s-snack-hut"}, {"name": "Get Smashed", "lat": 45.7575421, "lon": 21.2275103, "address": "Str. Gheorghe Lazăr, Timișoara", "found": true, "cat": "food", "desc": "Burger OG – un smashed burger cu chiflă pufoasă, carne rumenită, cheddar, bacon, ceapă și sosul Get Smashed, cu note ușor dulci și picante. O combinație clasică, dar bine echilibrată, cu carne, brânză, bacon și sos într-o singură îmbucătură Get Smashed – un loc dedicat stilului smashed burger, unde carnea bine rumenită și combinațiile simple sunt în centrul meniului. Un concept casual, construit în jurul burgerilor făcuți să fie savurați fără prea multă formalitate", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/70980MT9_2813.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/get-smashed"}, {"name": "Gratarul cu staif", "lat": 45.7588503, "lon": 21.2301508, "address": "Str. Matei Corvin, Timișoara", "found": true, "cat": "food", "desc": "Coaste cu sos BBQ – coaste fragede, rumenite pe grătar și glazurate într-un sos dulce și ușor afumat, cu note de miere și melasă. Servite alături de cartofi prăjiți, pentru o combinație generoasă și savuroasă. Grătarul cu Ștaif – un restaurant de familie din Timișoara, a cărui poveste a început în 2015 în jurul grătarului și al pasiunii pentru coaste. Astăzi, meniul merge de la coaste și burgeri până la preparate afumate lent, păstrând aceeași idee de mâncare făcută cu răbdare și cu gust.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/20014MT9_2047.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/gratarul-cu-staif"}, {"name": "Jack's Bistro", "lat": 45.757079, "lon": 21.227928, "address": "Cetate, Timișoara", "found": true, "cat": "food", "desc": "Jack`s Bistro Cheesecake cu pere caramelizate – un desert cu textură fină și cremoasă, completat de dulceața și aroma intensă a perelor caramelizate. Un contrast plăcut între baza delicată a cheesecake-ului și fructul cald, cu note de caramel. Jack's Bistro – „The Cosy Place”, un bistro care și-a construit povestea în jurul ideii de loc în care oamenii se întâlnesc la masă. Deschis din 2015, Jack’s Bistro combină preparate clasice cu reinterpretări moderne, de la burgeri și paste până la deserturi făcute în casă.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/82829MT9_1345.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/jack-s-bistro"}, {"name": "Juma' de kil", "lat": 45.75917, "lon": 21.229752, "address": "Str. Oituz 5 (Cetate), Timișoara", "found": true, "cat": "food", "desc": "Sandwich Cheesy Smart Crispy – un sandwich generos, în care partea crocantă a puiului contrastează cu textura moale a lipiei făcute în casă și cu componenta cremoasă de brânză. Un preparat construit în jurul contrastului dintre crocant și cremos Juma' de Kil – un nume care și-a construit identitatea în jurul sandwich-urilor consistente și al reinterpretării lor în combinații proprii. Preparatele sunt făcute să fie generoase, iar pâinea și rețetele casei au un rol important în ceea ce găsești aici", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/85291MT9_5068.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/sandwich-juma-de-kil"}, {"name": "Juno Sandwichery", "lat": 45.756813, "lon": 21.229699, "address": "Str. Episcop Augustin Pacha 5, Timișoara", "found": true, "cat": "food", "desc": "Deep Dish Cheese / Deep Dish Bacon – alegi una dintre cele două variante: Deep Dish Cheese , varianta vegetariană, sau Deep Dish Bacon , pentru cei care preferă o versiune cu carne. Ambele păstrează caracterul bogat și reconfortant al unui deep dish, cu multă brânză și o textură consistentă. Juno Sandwichery – un loc din Timișoara dedicat sandwich-urilor și preparatelor inspirate din street food, cu rețete proprii și combinații generoase. Juno pune accent pe preparate făcute cu atenție și pe ideea de comfort food bine executat.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/51706MT8_3136.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/juno-sandwichery"}, {"name": "Kai", "lat": 45.765222, "lon": 21.229633, "address": "Iulius Town / Openville, Timișoara", "found": true, "cat": "food", "desc": "Șnițel KAI – șnițel în crustă crocantă de semințe, servit alături de un piure fin, îmbogățit cu cremă de trufe. O combinație în care textura crocantă a crustei întâlnește cremozitatea piureului și aroma intensă a trufelor. KAI – restaurant & lounge din Iulius Gardens, unde gastronomia internațională se întâlnește cu seri de muzică live, cocktailuri și evenimente. Un loc care își schimbă ritmul de-a lungul săptămânii, de la prânzuri și cine la seri cu muzică și atmosferă de lounge.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/88381MT9_5448.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/kai"}, {"name": "Focacceria", "lat": 45.755232, "lon": 21.227908, "address": "La Focacceria, Cetate, Timișoara", "found": true, "cat": "food", "desc": "Delizia al Limone – un desert italian delicat, cu aromă proaspătă de lămâie și o textură fină și cremoasă. Un desert echilibrat, în care aciditatea citricelor aduce prospețime fiecărei îmbucături La Focacceria – un loc inspirat de gastronomia italiană, unde preparatele aduc în prim-plan gusturile autentice și rețetele specifice Italiei. De la preparate sărate până la deserturi, meniul păstrează un stil simplu, axat pe ingrediente și combinații care vorbesc de la sine", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/77691MT9_0397.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/focacceria"}, {"name": "Little Hanoi", "lat": 45.758284, "lon": 21.225999, "address": "Cetate, Timișoara", "found": true, "cat": "food", "desc": "Sandwich vietnamez – un preparat inspirat de celebrul Bánh mì , în care pâinea crocantă întâlnește umpluturi aromate, legume proaspete și influențe specifice bucătăriei vietnameze. Un contrast plăcut între crocant, fresh și condimentat. Little Hanoi – unul dintre locurile din Timișoara dedicate bucătăriei vietnameze, cu preparate inspirate din rețete tradiționale și ingrediente specifice gastronomiei din Vietnam. Bánh mì este chiar unul dintre preparatele reprezentative ale locului, alături de Pho și Goi Cuon.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/54838MT8_2687.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/little-hanoi"}, {"name": "Little Italy by Prime", "lat": 45.765017, "lon": 21.227904, "address": "Iulius Town / Openville, Timișoara", "found": true, "cat": "food", "desc": "Salsa Mediterranea & Campari Soda – o combinație mediteraneană cu măsline, roșii uscate și mult ulei de măsline de calitate, acompaniată de un Campari Soda răcoritor. Simplă ca ingrediente, dar cu un gust intens și bine conturat. Little Italy by Prime – un restaurant italian-mediteranean din Iulius Town, unde rețetele italiene sunt reinterpretate printr-o abordare contemporană. Meniul pune accent pe paste proaspete, pizza, preparate din pește și fructe de mare, dar și pe ingrediente specifice bucătăriei mediteraneene.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/29702MT8_2004.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/little-italy-by-prime"}, {"name": "Locanda Del Corso", "lat": 45.757584, "lon": 21.226133, "address": "Cetate, Timișoara", "found": true, "cat": "food", "desc": "Lasagna Bolognese – foi de paste, ragu bolognese, sos bechamel și brânzeturi, așezate în straturi și gratinate până la o crustă ușor rumenită. Un preparat reconfortant, cu texturi cremoase și un gust bogat, specific bucătăriei italiene. Locanda del Corso – un restaurant cu specific italian, situat pe strada pietonală Mărășești, în centrul Timișoarei. Cu o terasă integrată în atmosfera străzii și un meniu construit în jurul bucătăriei italiene și mediteraneene, Locanda păstrează un aer elegant, dar primitor.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/55131MT9_1024.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/locanda-del-corso"}, {"name": "M Bistro", "lat": 45.757619, "lon": 21.229992, "address": "Piața Unirii, Cetate, Timișoara", "found": true, "cat": "food", "desc": "Cannolo cu cremă de fistic – un desert de inspirație siciliană, cu înveliș crocant și cremă fină de fistic. Contrastul dintre textura crocantă și umplutura cremoasă îl face un desert simplu, dar cu multă personalitate. M Bistro – aflat în Piața Unirii, M Bistro este genul de loc care combină atmosfera de cafenea cu cea de restaurant, într-un meniu care merge de la mic dejun și burgeri până la paste, piadine și deserturi. Un bistro urban cu o ofertă variată, potrivită pentru momente diferite ale zilei.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/96049MT9_9259.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/m-bistro"}, {"name": "Namaste", "lat": 45.756838, "lon": 21.229498, "address": "Str. Eugeniu de Savoya 8, Timișoara", "found": true, "cat": "food", "desc": "Butter Chicken – bucăți fragede de pui gătite lent într-un sos cremos, bogat în unt, roșii și condimente indiene. Un preparat aromat, cu un echilibru plăcut între partea condimentată și textura catifelată a sosului. Namaste – un restaurant din centrul Timișoarei dedicat bucătăriei indiene, cu un meniu care trece prin preparate clasice, de la curry-uri și tandoori până la biryani și pâine naan. Condimentele și rețetele specifice Indiei sunt în centrul experienței, cu posibilitatea de a descoperi diferite niveluri de intensitate a gustului.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/93051MT9_1848.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/namaste"}, {"name": "Odaia", "lat": 45.757857, "lon": 21.230218, "address": "Piața Unirii 13, Timișoara", "found": true, "cat": "food", "desc": "Pate de mangaliță cu cremă de brânză – un preparat cu gust bogat și textură fină, în care savoarea intensă a mangaliței este echilibrată de cremozitatea brânzei. O combinație inspirată din bucătăria românească, cu un aer contemporan. Odaia – un restaurant neo-tradițional din Piața Unirii, care aduce în prezent gusturile bucătăriei românești. Meniul pune accent pe ingrediente locale, preparate făcute în casă și rețete inspirate din gastronomia de odinioară, de la pâine coaptă pe vatră și afumături până la preparate reinterpretate.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/85148MT9_0685.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/odaia"}, {"name": "Paso", "lat": 45.756687, "lon": 21.229055, "address": "Str. Eugeniu de Savoya 6B, Timișoara", "found": true, "cat": "food", "desc": "Coaste de vită gătite lent – carne fragedă, gătită îndelung pentru o textură care se desprinde ușor, alături de accente proaspete și aromatice: lime confiat, crevete infuzat cu flori de tei și un piure fin de leurdă și rădăcină de pătrunjel. O combinație complexă, în care elementele dulci, citrice și ierboase se completează reciproc. PASO Local Cuisine – un restaurant din centrul Timișoarei care își construiește meniul în jurul ideii de bucătărie locală reinterpretată, cu influențe internaționale. Preparatele sunt dezvoltate de Chef Daniel Grosu și pun accent pe ingrediente locale, gătit la foc și combinații neobișnuite.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/3066MT8_4641.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/paso"}, {"name": "Pasta Io", "lat": 45.765708, "lon": 21.229255, "address": "Iulius Town / Openville, Timișoara", "found": true, "cat": "food", "desc": "Carbonara – paste artizanale cu un sos cremos și intens, completate de guanciale, pecorino, grana padano, gălbenuș și piper negru. O versiune bogată și bine echilibrată a unuia dintre cele mai cunoscute preparate italiene. Pastaio – laborator de paste artizanale din Timișoara, născut din pasiunea pentru cultura italiană și pentru prepararea pastelor. Pastele sunt extrudate prin matrițe tradiționale din bronz, pentru o textură care reține mai bine sosul, iar întregul concept este construit în jurul pastelor proaspete și al rețetelor italiene.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/39221MT8_1192.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/pasta-io"}, {"name": "Pasticceria", "lat": 45.756493, "lon": 21.227776, "address": "Str. Vasile Alecsandri 3, Timișoara", "found": true, "cat": "food", "desc": "Brownie cu ciocolată, caramel toffee și bezea italiană – un desert cu interior dens și intens de ciocolată, completat de dulceața caramelului toffee și de textura aerată a bezelei italiene. Un contrast plăcut între bogat, dulce și delicat. Pasticceria – o cofetărie din centrul Timișoarei, pe strada Vasile Alecsandri, dedicată deserturilor și produselor de patiserie. Un loc mic și cochet, potrivit pentru cei care apreciază deserturile lucrate cu atenție și vitrinele în care fiecare produs își are locul.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/53500MT8_3939.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/pasticceria"}, {"name": "Raku Sushi", "lat": 45.757857, "lon": 21.230218, "address": "Piața Unirii 13, Timișoara", "found": true, "cat": "food", "desc": "Rainbow Roll – un rulou de sushi cu o bază fresh de surimi, avocado și castravete, acoperit cu felii de somon, ton și anghilă. O combinație variată de texturi și gusturi, de la prospețimea legumelor până la aromele mai intense ale peștelui. Raku Sushi – un restaurant din Piața Unirii dedicat bucătăriei asiatice, cu sushi în centrul meniului. Raku pune accent pe pește proaspăt, roll-uri pregătite de chefi asiatici și rețete inspirate din gastronomia japoneză, completate de alte preparate asiatice.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/23770MT9_9671.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/raku-sushi"}, {"name": "Pepper Steak & Shake", "lat": 45.75787, "lon": 21.230034, "address": "Piața Unirii 13, Timișoara", "found": true, "cat": "food", "desc": "Beef Brisket Confit – brisket de vită gătit lent, până când carnea devine fragedă și bogată în gust, servit într-un sos catifelat, cu note de vin roșu și piper verde murat. Aromele de usturoi, cimbru și ardei copt completează preparatul, fără să acopere gustul cărnii. Pepper - Steak & Shake – situat în Piața Unirii, Pepper pune carnea de vită în centrul experienței sale, de la steak-uri premium și preparate gătite lent până la burgeri și specialități ale casei. Restaurantul combină bucătăria cu o selecție de cocktailuri și vinuri, într-un decor cu vedere spre una dintre cele mai animate piețe din Timișoara.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/3762MT9_9812.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/pepper-steak-shake"}, {"name": "Riviere", "lat": 45.748879, "lon": 21.226933, "address": "Splaiul Spiru Haret, Timișoara", "found": true, "cat": "food", "desc": "Surf and Turf – o combinație între carne fragedă și accente marine, în care roastbeef-ul și creveții marinați în citrice sunt completate de prospețimea feniculului, maioneza cu hrean și pătrunjel și caperele crocante. Uleiul aromat de pătrunjel și mărar leagă toate elementele într-un preparat cu contraste de texturi și arome. Rivière – amplasat pe malul Begăi, în Parcul Justiției, Rivière este un restaurant cu specific mediteranean, cunoscut pentru terasa cu vedere spre apă și pentru meniul care combină preparate internaționale cu creații proprii. Din 2015, locul își dezvoltă constant meniul, punând accent pe preparate variate și ingrediente proaspete.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/30009MT9_2165.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/riviere"}, {"name": "STED", "lat": 45.75794, "lon": 21.229837, "address": "Piața Unirii, Timișoara", "found": true, "cat": "food", "desc": "Saigon Sandwich – o reinterpretare a celebrului Bánh mì vietnamez, cu contrast între bagheta crocantă, carnea fragedă și elementele fresh și murate. O combinație de gusturi aromate, ușor acrișoare și condimentate. STED – un sandwichery din Timișoara care a construit un meniu în jurul unor combinații inspirate din diferite bucătării și reinterpretate în format de sandwich. De la Saigon la Milano, Havana sau Tokyo, fiecare variantă are propria direcție și propriul profil de gust.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/22307MT9_0983.JPG", "url": "https://www.timisoaratastingtour.ro/mancare/sted"}, {"name": "Tassei", "lat": 45.759008, "lon": 21.230176, "address": "Cetate, Timișoara", "found": true, "cat": "food", "desc": "Usuzukuri cu somon – felii foarte fine de somon, servite într-o combinație delicată de note citrice și umami, cu yuzu, sos de soia, mirin, ponzu și ulei de trufe. Un preparat în care prospețimea somonului rămâne în prim-plan. Tassei – un restaurant japonez din centrul Timișoarei, unde sushi-ul și preparatele robata sunt în centrul meniului. Tassei pune accent pe tehnici japoneze, ingrediente atent alese și o prezentare minimalistă, într-un spațiu inspirat de estetica Japoniei.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/33924MT9_1699.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/tassei"}, {"name": "Taste of Bali", "lat": 45.756708, "lon": 21.22744, "address": "Str. Eugeniu de Savoya 15B, Timișoara", "found": true, "cat": "food", "desc": "Siomay Bandung – găluște în stil indonezian, cu umplutură de pui și legume, servite cu arahide, lime, sos de soia dulce și ardei iute. O combinație de texturi și gusturi în care dulceața, aciditatea și iuțeala se completează. Taste of Bali – un restaurant din Timișoara dedicat bucătăriei indoneziene, cu preparate inspirate din diferite regiuni ale Indoneziei. Meniul aduce în prim-plan rețete tradiționale, condimente și sosuri specifice, de la preparate cu curry și sate până la tăiței și orez în stil indonezian.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/83381MT9_2367.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/taste-of-bali"}, {"name": "Vinto", "lat": 45.756785, "lon": 21.228954, "address": "Cetate, Timișoara", "found": true, "cat": "food", "desc": "Kebab de țelină la jar & wine pairing – țelină gătită la jar, cu roșii, ghimbir, soia și lime, completată de orez expandat și accente fresh de mentă și măr. Totul este acompaniat de un wine pairing ales pentru a completa preparatul, într-o combinație cu note afumate, fresh și ușor acidulate. VinTo – un gastro wine bar din centrul istoric al Timișoarei, unde vinul este în centrul experienței, iar preparatele sunt gândite pentru a-l pune în valoare. Selecția de vinuri și pairingurile propuse creează o experiență în care fiecare combinație are propriul echilibru.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/38977MT8_3314.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/vinto"}, {"name": "Woktagon", "lat": 45.757762, "lon": 21.225941, "address": "Cetate, Timișoara", "found": true, "cat": "food", "desc": "Tteokbokki & Korean Bites – o selecție de gustări coreene cu tteokbokki în sos dulce-picant, crispy mandu, tofu tempura și ridiche galbenă murată. Un mix de texturi și arome, de la picant și crocant până la fresh și ușor acrișor. Woktagon – un loc din Timișoara dedicat bucătăriei asiatice, cu influențe puternice din gastronomia coreeană. Meniul aduce preparate cunoscute din street food-ul asiatic, reinterpretate într-un stil accesibil și potrivit pentru cei care vor să descopere gusturi diferite.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/8945MT9_0887.JPG", "url": "https://www.timisoaratastingtour.ro/mancare/woktagon"}, {"name": "Why Pizza", "lat": 45.756297, "lon": 21.228022, "address": "Cetate, Timișoara", "found": true, "cat": "food", "desc": "Panini cu rață slow cooked & pere Conference caramelizate – carne de rață gătită lent, până devine fragedă, completată de dulceața perelor caramelizate. O combinație în care gustul bogat al cărnii este echilibrat de nota dulce și fructată a perelor, într-un panini cu accente gourmet. Why Pizza – o pizzerie al taglio și panini bar din Piața Unirii, inspirată de stilul roman și de cultura street food-ului italian. Pe lângă pizza cu aluat dospit lent, meniul include panini artizanale și combinații originale, de la rețete clasice până la variante gourmet.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/99517MT8_3038.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/why-pizza"}, {"name": "Zai Apres Cafe", "lat": 45.756796, "lon": 21.228745, "address": "Str. Florimund Mercy 5, Cetate, Timișoara", "found": true, "cat": "food", "desc": "Kaiserschmarrn cu compot de prune & dulceață de flori de soc – un desert tirolez, cu bucăți pufoase și ușor rumenite, servite alături de compot de prune și dulceață de flori de soc. Dulceața fructată și aroma delicată a florilor de soc echilibrează foarte bine desertul. Zai Après Café – un loc care aduce în centrul Timișoarei atmosfera unui après-ski din Alpi, de la decor și muzică până la preparatele inspirate din bucătăria tiroleză. Meniul include specialități precum Kaiserschmarrn, Weißwurst și spätzle, alături de cafea, vinuri și cocktailuri.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/2011MT8_2361.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/zai-apres-cafe"}, {"name": "Zaytoun", "lat": 45.758165, "lon": 21.228086, "address": "Cetate, Timișoara", "found": true, "cat": "food", "desc": "Baclava – foi fine și crocante, cu umplutură bogată și sirop aromat, într-un desert specific bucătăriei levantine. Un echilibru plăcut între textura crocantă și dulceața siropului. Zaytoun – un restaurant cu specific libanez din Piața Unirii, creat în jurul gastronomiei și culturii libaneze. Povestea locului pornește de la Oana și Salim, care au adus în restaurant influențe din călătoriile lor și din bucătăria libaneză autentică.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/30775MT9_3175.jpg", "url": "https://www.timisoaratastingtour.ro/mancare/zaytoun"}, {"name": "Alice Kyteler", "lat": 45.758436, "lon": 21.229487, "address": "Piața Unirii, Cetate, Timișoara", "found": true, "cat": "drink", "desc": "Witch Tonic – un cocktail pe bază de gin, cu note delicate de migdale, pentru o combinație aromată, fresh și ușor misterioasă. Alice Kyteler – un bar cu atmosferă eclecticǎ și un meniu de cocktailuri care invită la descoperit combinații mai puțin obișnuite.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/89515MT9_1537.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/alice-kyteler"}, {"name": "Atelier D experience", "lat": 45.755123, "lon": 21.227984, "address": "Str. Dimitrie Cantemir 1, Timișoara", "found": true, "cat": "drink", "desc": "Bega Breeze – gin, aloe vera și violete într-un cocktail fresh, floral și delicat, cu un aer de vară și o culoare care face jumătate din treabă. Atelier D’Experience – un loc în care experiența începe înainte de prima înghițitură, de la decor și atmosferă până la combinațiile din pahar.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/38699MT9_2528.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/atelier-d-experience"}, {"name": "Ayahuasca", "lat": 45.757855, "lon": 21.225464, "address": "Str. Gheorghe Lazăr, Cetate, Timișoara", "found": true, "cat": "drink", "desc": "Cocktail Peruvian Pisco – un cocktail cu Pisco, spiritul emblematic al Peruului, cu un profil fresh și aromat, perfect pentru cei care vor să descopere o altă față a cocktailurilor clasice. Ayahuasca – un loc cu influențe sud-americane, atmosferă vibrantă și o selecție de băuturi care te poartă puțin mai departe de Timișoara.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/61337MT9_3433.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/ayahuasca"}, {"name": "Baroque", "lat": 45.757532, "lon": 21.229982, "address": "Piața Unirii, Cetate, Timișoara", "found": true, "cat": "drink", "desc": "Gin Ruby Brew – gin și cold brew într-un mix neașteptat, cu note de cafea și un profil intens, dar echilibrat. Baroque – o cafenea de specialitate cu o identitate bine conturată, unde cafeaua ocupă locul central, iar creativitatea se simte și dincolo de ceașcă.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/73510MT9_9837.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/baroque"}, {"name": "Bereta", "lat": 45.758072, "lon": 21.22621, "address": "Str. Mărășești 12, Timișoara", "found": true, "cat": "drink", "desc": "Smoothie Sour 200 ml – o bere sour cu textură catifelată și note fructate, gândită pentru cei care preferă berile cu personalitate și un profil mai fresh Bereta Taproom & Bottleshop – un loc pentru cei care își aleg berea după gust, nu după etichetă, cu o selecție care trece mult dincolo de clasicele beri blonde", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/92941WhatsApp-Image-2026-09-23-at-13.12.49.jpeg", "url": "https://www.timisoaratastingtour.ro/bauturi/bereta"}, {"name": "D'arc Atelier", "lat": 45.758343, "lon": 21.228037, "address": "Piața Unirii 5 (colț Str. Eremia Grigorescu), Timișoara", "found": true, "cat": "drink", "desc": "D`arc Atelier Velvet S trawberry Colada – un cocktail cu lichior Bumbu , suc de ananas, sweet & sour și piure de căpșuni. Fructat și fresh, cu un echilibru între dulceața ananasului și căpșunilor și nota ușor acidulată a mixului. D’arc Atelier – un spațiu cunoscut pentru atmosfera sa urbană și programul variat de evenimente, de la seri cu muzică și DJ seturi până la evenimente culturale. Un loc cu o identitate proprie în peisajul de nightlife al Timișoarei.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/69860MT9_2810.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/d-arc-atelier"}, {"name": "Hype", "lat": 45.757678, "lon": 21.227336, "address": "Piața Unirii 4, Cetate, Timișoara", "found": true, "cat": "drink", "desc": "Hype Velvet Monkey – poți alege una dintre cele două variante ale cocktailului: varianta cu alcool sau varianta N.A. , fără alcool. Două versiuni ale aceleiași combinații, în funcție de ce preferi. Hype Culture – un restaurant și bar din centrul Timișoarei, unde partea de gastronomie se întâlnește cu cocktailurile, muzica și evenimentele live. Locul are un ritm propriu, de la mese și brunch-uri până la seri cu DJ și o atmosferă mai energică.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/11404MT9_2110.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/hype"}, {"name": "Irish Pub", "lat": 45.756782, "lon": 21.230642, "address": "Str. Eugeniu de Savoya 4, Cetate, Timișoara", "found": true, "cat": "drink", "desc": "Shot Irish Spirit – un shot cu personalitate, inspirat de spiritul irlandez și făcut pentru cei care vor să înceapă experiența cu ceva scurt și intens. Irish Public House – un pub din centrul Timișoarei, inspirat de atmosfera tradițională a puburilor irlandeze. Muzica, băuturile și preparatele cu specific creează un loc potrivit pentru întâlniri cu prietenii și seri care se prelungesc la povești.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/51540MT8_5058.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/irish-pub"}, {"name": "Le Dome", "lat": 45.758406, "lon": 21.229886, "address": "Piața Unirii 11, Timișoara", "found": true, "cat": "drink", "desc": "Kir Royal / Cinderella – ai de ales între două variante: Kir Royal , varianta cu alcool, sau Cinderella , varianta fără alcool. Două cocktailuri diferite, pentru aceeași idee de răsfăț la pahar. Le Dome – amplasat chiar în Piața Unirii, Le Dome combină partea de cafenea, bistro și bar, cu un meniu internațional și o terasă cu vedere spre una dintre cele mai cunoscute piețe ale orașului.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/17991MT9_0986.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/le-dome"}, {"name": "Matcha Ty", "lat": 45.756335, "lon": 21.230816, "address": "Str. Eugeniu de Savoya 1, Cetate, Timișoara", "found": true, "cat": "drink", "desc": "Crushed Lychee Matcha – matcha cu note delicate de lychee, într-o combinație fresh și fructată, care echilibrează gustul vegetal al matcha-ului cu dulceața aromată a fructului. Matcha TY – primul bar autentic de matcha din Timișoara, dedicat în întregime culturii matcha și preparării ei în forme diferite. Locul pune accent pe calitate și pe prepararea atentă a matcha-ului, într-un spațiu dedicat celor care vor să descopere băutura dincolo de varianta clasică.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/55686MT9_9076.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/matcha-ty"}, {"name": "Nava Pelican", "lat": 45.748859, "lon": 21.224838, "address": "Canal Bega, lângă Podul Mihai Viteazu, Timișoara", "found": true, "cat": "drink", "desc": "Shot Brain Damage – un shot cu lichior de piersici, Baileys și sirop de grenadine, cu un profil dulce, cremos și fructat. Pelican – un loc cu totul aparte în Timișoara, aflat chiar pe Bega, la bordul legendarului vapor Pelican. Cu o poveste legată de oraș și de viața de pe canal, locul păstrează un aer nostalgic și o identitate pe care nu o găsești în orice bar.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/92401MT9_3017.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/nava-pelican"}, {"name": "Reciproc", "lat": 45.757379, "lon": 21.233448, "address": "Str. Martin Luther 4, Cetate, Timișoara", "found": true, "cat": "drink", "desc": "Tap Beer Independent – poți alege una dintre cele trei variante: Pils, Weiss sau Helles , fiecare cu propriul profil de gust, de la caracterul mai fresh și ușor amar al unui Pils până la notele mai blânde și maltate ale unui Helles. Reciproc – un loc care a pornit ca băcănie cu produse artizanale și a devenit un reper pentru cei interesați de producători locali, bere craft și produse făcute cu grijă. În plus față de selecția de beri, găsești cafea, vinuri și produse locale, într-un spațiu care pune accent pe comunitate și consum responsabil.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/90MT8_3402.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/reciproc"}, {"name": "Stage Pub", "lat": 45.756394, "lon": 21.228702, "address": "Str. Florimund Mercy, Cetate, Timișoara", "found": true, "cat": "drink", "desc": "Honey Berry Fizz – un cocktail cu Jack Daniel’s Honey , cu note dulci și fructate, completate de o doză de prospețime și un finish ușor acidulat. O combinație echilibrată între caracterul whiskey-ului și aromele de fructe de pădure. Stage Pub – un pub din centrul Timișoarei în care muzica live este parte din identitatea locului. Cu seri dedicate concertelor, influențe rock și un meniu de food & drinks, Stage Pub pune accent pe energia de concert și pe atmosfera de pub.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/12594MT9_2375.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/stage-pub"}, {"name": "Storia", "lat": 45.75667, "lon": 21.228195, "address": "Str. Eugeniu de Savoya, Cetate, Timișoara", "found": true, "cat": "drink", "desc": "Rum & Mango – un cocktail cu Bacardi alb și sirop de mango, cu un profil fructat și dulce, echilibrat de caracterul discret al romului. Simplu, fresh și ușor de savurat. Storia – un restaurant și cocktail bar din Timișoara, cunoscut pentru serile animate, meniul variat și atmosfera urbană. Un loc în care partea de gastronomie se îmbină cu băuturile și evenimentele, de la brunch-uri și cine până la seri cu muzică.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/3662file_0000000082d0820a806b343f58f476de.png", "url": "https://www.timisoaratastingtour.ro/bauturi/storia"}, {"name": "The Charlatan's Pub", "lat": 45.758555, "lon": 21.227101, "address": "Str. Emanuil Ungureanu, Cetate, Timișoara", "found": true, "cat": "drink", "desc": "The Charlatan`s Pub JACK PINE-APPLE – Jack Apple, suc de lămâie, suc de ananas, apă tonică și frunză de busuioc. Un cocktail fresh, cu note fructate și o ușoară aciditate, completat de aroma subtilă de busuioc The Charlatans Pub – un pub cu atmosferă relaxată și energie bună, potrivit pentru o pauză de la traseul gastronomic și un cocktail savurat alături de prieteni. Un loc unde muzica, băuturile și atmosfera de pub se întâlnesc într-un cadru casual", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/74430Screenshot-2025-09-16-105126.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/the-charlatan-s-pub"}, {"name": "Toffee Coffee", "lat": 45.756958, "lon": 21.22992, "address": "Str. Episcop Augustin Pacha, Cetate, Timișoara", "found": true, "cat": "drink", "desc": "Açai Smoothie – un smoothie fresh și fructat, cu textura cremoasă specifică açaiului și un gust natural, ușor acrișor. O băutură răcoritoare, potrivită pentru cei care preferă combinațiile cu fructe. Toffee Coffee – o cafenea de specialitate din centrul Timișoarei, cunoscută pentru cafeaua atent preparată, deserturi și băuturi creative. Are și o curte interioară liniștită, care completează atmosfera intimă a locului.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/80594WhatsApp-Image-2026-09-19-at-14.27.24.jpeg", "url": "https://www.timisoaratastingtour.ro/bauturi/toffee-coffee"}, {"name": "Tucano Coffee Venezuela", "lat": 45.765751, "lon": 21.229167, "address": "Piața Consiliul Europei 2 (Iulius Town), Timișoara", "found": true, "cat": "drink", "desc": "Iullius Town Aqua Mango Matcha – matcha preparată cu Aqua Carpatica Flavours cu aromă de mango , o combinație fresh și fructată, în care gustul vegetal al matcha-ului este completat de aroma dulce și tropicală a mango-ului. Tucano Coffee Venezuela Iulius Town – o cafenea cu un concept inspirat din cultura cafelei și din spiritul călătoriilor, cunoscută pentru atmosfera colorată, băuturile creative și combinațiile care ies din tiparele clasice. Locația din Iulius Town aduce în meniu cafea, matcha și băuturi fresh, într-un spațiu relaxat și vibrant.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/61267MT9_5702.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/tucano-coffee-venezuela-iullius-town"}, {"name": "Tucano Coffee Mexico", "lat": 45.756704, "lon": 21.22718, "address": "Str. Eugeniu de Savoya (Piața Unirii), Cetate, Timișoara", "found": true, "cat": "drink", "desc": "Piața Unirii Ice Latte + Carrot Cake – combinația dintre un ice latte rece și cremos și o felie de carrot cake cu aromă de scorțișoară și textură fragedă. Un duo echilibrat între cafea, condimente calde și dulceață. Tucano Coffee Mexico Piața Unirii – o cafenea cu un concept inspirat din cultura cafelei de specialitate și din atmosfera vibrantă a orașului. Situată în Piața Unirii, locația combină cafeaua, deserturile și un design colorat, într-un spațiu potrivit pentru întâlniri, lucru sau o pauză de la agitația orașului.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/6624MT9_1636.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/tucano-coffee-mexico-piata-unirii"}, {"name": "Wizards", "lat": 45.754396, "lon": 21.228357, "address": "Str. János Bolyai, Timișoara", "found": true, "cat": "drink", "desc": "Peach Ring Margarita – o margarita cu un twist fructat, inspirată de gustul dulce și ușor acrișor al bomboanelor Peach Ring. O variantă jucăușă a unui cocktail clasic, cu un profil fresh și dulce-acrișor. Wizards – un pub cu tematică magică în centrul Timișoarei, unde cocktailurile devin parte din povestea locului. Decorul inspirat de universul vrăjitorilor, băuturile cu denumiri tematice și atmosfera de seară îi dau un caracter aparte.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/37171MT9_0193.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/wizards"}, {"name": "Zai Miniature", "lat": 45.756796, "lon": 21.228745, "address": "Str. Florimund Mercy 5, Cetate, Timișoara", "found": true, "cat": "drink", "desc": "Mezcalita a la Zai – mezcal infuzat cu ananas și castravete, îndulcit cu sirop de miere și echilibrat cu suc de lime. Un cocktail cu note afumate, fructate și fresh, în care dulceața și aciditatea se completează foarte bine. Zai Mini – un cocktail bar și cafenea din Piața Unirii, cunoscut pentru selecția de cocktailuri și băuturi pregătite în combinații proprii. Terasa cu vedere spre piață și poziționarea centrală fac parte din identitatea locului.", "img": "https://www.timisoaratastingtour.ro/imagini/1200x1200/26400MT9_1220--1-.jpg", "url": "https://www.timisoaratastingtour.ro/bauturi/zai-miniature"}]; const COLOR={food:'#c0392b',drink:'#6c3fb5'}; const shown={food:true,drink:true};
/* invalidateSize-injected */ const map=window.map=L.map('map').setView([45.7565,21.2287],15);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'}).addTo(map);
let nFood=0,nDrink=0; DATA.forEach(d=>{d.n=(d.cat==='food')?++nFood:++nDrink;});
function icon(d){return L.divIcon({className:'',html:`<div style="background:${COLOR[d.cat]};color:#fff;border:2px solid #fff;border-radius:50%;width:26px;height:26px;line-height:22px;text-align:center;font-weight:600;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.4)">${d.n}</div>`,iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-14]});}
DATA.forEach(d=>{const g=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.name+' Timisoara')}`;
  const emoji=d.cat==='food'?'🍽️':'🍸';
  const img=d.img?`<img src="${d.img}" alt="${d.name}"/>`:'';
  const desc=d.desc?`<div style="font-size:12px;color:#555;line-height:1.45">${d.desc}</div>`:'';
  d.marker=L.marker([d.lat,d.lon],{icon:icon(d)});
  d.marker.bindPopup(`<b>${emoji} ${d.n}. ${d.name}</b>${img}${desc}<div style="color:#888;font-size:11px;margin-top:5px">${d.address||''}</div><a href="${g}" target="_blank">➜ Google Maps</a>`,{maxWidth:260});
  d.marker.addTo(map);});
const list=document.getElementById('list');
function buildList(){list.innerHTML='';const q=(document.getElementById('q').value||'').toLowerCase();
  DATA.forEach(d=>{if(!shown[d.cat])return; const hay=(d.name+' '+(d.desc||'')).toLowerCase(); if(q&&!hay.includes(q))return;
    const g=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.name+' Timisoara')}`;const emoji=d.cat==='food'?'🍽️':'🍸';
    const thumb=d.img?`<img class="thumb" src="${d.img}" alt="">`:'';
    const descLine=d.desc?`<div class="desc">${d.desc}</div>`:'';
    const li=document.createElement('li');
    li.innerHTML=`<div class="row"><span class="num ${d.cat}">${d.n}</span>${thumb}<span class="info"><b>${emoji} ${d.name}</b><span class="addr">${d.address||''}</span></span></div>${descLine}<a class="gmaps ${d.cat}" href="${g}" target="_blank" onclick="event.stopPropagation()">➜ Google Maps</a>`;
    li.onclick=()=>{map.setView([d.lat,d.lon],17);d.marker.openPopup();};list.appendChild(li);});}
function applyFilter(){DATA.forEach(d=>{if(shown[d.cat])d.marker.addTo(map);else map.removeLayer(d.marker);});
  document.getElementById('fFood').classList.toggle('off',!shown.food);document.getElementById('fDrink').classList.toggle('off',!shown.drink);
  const parts=[];if(shown.food)parts.push(nFood+' restaurante');if(shown.drink)parts.push(nDrink+' baruri');
  document.getElementById('cnt').textContent=parts.join(' + ')||'niciun local';buildList();}
document.getElementById('fFood').onclick=()=>{shown.food=!shown.food;applyFilter();};
document.getElementById('fDrink').onclick=()=>{shown.drink=!shown.drink;applyFilter();};
document.getElementById('q').addEventListener('input',buildList);
map.fitBounds(DATA.map(d=>[d.lat,d.lon]),{padding:[40,40]});applyFilter();

/* grabber-toggle-injected */
(function(){
  var sb=document.getElementById('sidebar'), gr=document.getElementById('grabber');
  if(gr){ gr.addEventListener('click',function(){ sb.classList.toggle('open'); setTimeout(function(){ if(window.map&&map.invalidateSize)map.invalidateSize(); },320); }); }
  // when a list item is tapped on mobile, collapse the sheet so the map is visible
  var ul=document.getElementById('list');
  if(ul){ ul.addEventListener('click',function(){ if(window.matchMedia('(max-width:760px)').matches){ sb.classList.remove('open'); } }); }
  window.addEventListener('resize',function(){ if(window.map&&map.invalidateSize)map.invalidateSize(); });
  setTimeout(function(){ if(window.map&&map.invalidateSize)map.invalidateSize(); },400);
})();
</script></body></html>
